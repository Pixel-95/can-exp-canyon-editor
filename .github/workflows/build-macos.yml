name: Build macOS Distribution

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (Catalina-compatible x64)
        run: npm run package:mac:catalina

      - name: Verify app architecture and minimum macOS version
        run: |
          APP_PATH="$(find release -type d -name 'Canyon Editor.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Canyon Editor.app not found under release/"
            exit 1
          fi

          BIN_PATH="$APP_PATH/Contents/MacOS/Canyon Editor"
          PLIST_PATH="$APP_PATH/Contents/Info.plist"
          ARCHS="$(lipo -archs "$BIN_PATH")"
          MIN_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST_PATH")"

          echo "App path: $APP_PATH"
          echo "Binary archs: $ARCHS"
          echo "LSMinimumSystemVersion: $MIN_VERSION"

          if [ "$ARCHS" != "x86_64" ]; then
            echo "Expected x86_64-only build for Catalina compatibility."
            exit 1
          fi
          if [ "$MIN_VERSION" != "10.15.0" ]; then
            echo "Expected LSMinimumSystemVersion=10.15.0."
            exit 1
          fi

      - name: Assemble distributable folder
        run: npm run package:dist

      - name: Verify output
        run: ls -la release/distributions/macos

      - name: Verify distributed app framework linkage
        run: |
          DIST_APP="release/distributions/macos/Canyon Editor.app"
          FRAMEWORK_BIN="$DIST_APP/Contents/Frameworks/Electron Framework.framework/Electron Framework"
          if [ ! -e "$FRAMEWORK_BIN" ]; then
            echo "Distributed app is missing Electron Framework binary: $FRAMEWORK_BIN"
            exit 1
          fi
          echo "Distributed framework binary present: $FRAMEWORK_BIN"

      - name: Create macOS tarball (preserve app bundle permissions)
        run: tar -czf release/canyon-editor-macos.tar.gz -C release/distributions macos

      - name: Upload macOS distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: canyon-editor-macos
          path: release/canyon-editor-macos.tar.gz
          if-no-files-found: error
